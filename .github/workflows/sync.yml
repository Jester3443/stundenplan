name: Stundenplan abrufen

on:
  schedule:
    # Schnell-Lauf alle 5 Minuten an Schultagen. GitHub rechnet in UTC:
    # 4-16 UTC deckt 6-18 Uhr deutscher Zeit in Sommer UND Winter ab.
    # Holt nur die laufende und die naechste Woche - dort passieren
    # Vertretungen. Dadurch belastet der haeufigere Takt den Schulserver
    # weniger als der bisherige 15-Minuten-Takt.
    # Die Minuten liegen bewusst NEBEN dem vollen Fuenf-Minuten-Raster
    # (2, 7, 12 ... statt 0, 5, 10 ...): Zur vollen Marke stehen bei GitHub
    # weltweit die meisten Zeitplaene an, und genau dann verwirft der
    # Scheduler am meisten. Beobachtet: ab Mitte September nur noch 6 statt
    # 150 Laeufe am Tag. Verlaesslich wird es erst mit dem externen Anstoss
    # (scripts/anstoss.gs) - der Zeitplan hier bleibt als Rueckfallebene.
    - cron: '2-59/5 4-16 * * 1-5'
    # Viermal taeglich der vollstaendige Plan (6 Wochen). Was weiter als zwei
    # Wochen entfernt liegt, aendert sich nicht im Minutentakt.
    - cron: '9 4,8,12,16 * * 1-5'
    # Abendvorschau: 19 UTC = 21:00 Sommerzeit / 20:00 Winterzeit,
    # sonntags bis donnerstags (fuer die Schultage Montag bis Freitag).
    - cron: '3 19 * * 0-4'
    # Morgenueberblick: 4:33 UTC = 6:33 Sommerzeit / 5:33 Winterzeit.
    - cron: '33 4 * * 1-5'
    # Hausaufgaben-Erinnerung am Vortag: 13:43 UTC = 15:43 Sommerzeit.
    - cron: '43 13 * * 0-4'
  workflow_dispatch: # Start von Hand oder durch den externen Anstoss
    inputs:
      aufgabe:
        description: 'schnell = zwei Wochen, voll = sechs Wochen; morgen/abend/aufgaben = voller Lauf plus Tagesmeldung'
        type: choice
        options: [schnell, voll, morgen, abend, aufgaben]
        default: voll

# Zwei gleichzeitige Laeufe wuerden sich gegenseitig ueberschreiben.
concurrency:
  group: stundenplan-sync
  cancel-in-progress: false

permissions:
  contents: write # zum Veroeffentlichen der Daten auf dem data-Zweig

jobs:
  abrufen:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Der zuletzt veroeffentlichte Stand als Vergleichsbasis - bewusst per
      # git und nicht ueber raw.githubusercontent.com: Dessen Auslieferung
      # kann einige Minuten alt sein, und dann meldete der naechste Lauf
      # denselben Ausfall ein zweites Mal.
      # Beim allerersten Lauf gibt es den Zweig noch nicht - darum nachsichtig.
      - name: Zuletzt veroeffentlichten Stand holen
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: data
          path: basis-stand
          fetch-depth: 1

      # Nur der Fuenf-Minuten-Takt laeuft verkuerzt. Alles andere - der
      # stuendliche Lauf, die Tagesmeldungen und der Start von Hand - holt
      # den vollstaendigen Plan.
      - name: Betriebsart bestimmen
        id: art
        env:
          # Ueber die Umgebung statt direkt in die Shell eingesetzt - so kann
          # der Wert die Befehlszeile nicht zerbrechen.
          ZEITPLAN: ${{ github.event.schedule }}
          AUFGABE: ${{ inputs.aufgabe }}
        run: |
          MELDUNG=keine
          case "$AUFGABE" in
            schnell) MODUS=schnell ;;
            voll)    MODUS=voll ;;
            morgen|abend|aufgaben) MODUS=voll; MELDUNG="$AUFGABE" ;;
            *)
              # Kein Handstart: die Aufgabe ergibt sich aus dem Zeitplan.
              case "$ZEITPLAN" in
                "2-59/5 4-16 * * 1-5") MODUS=schnell ;;
                "33 4 * * 1-5")        MODUS=voll; MELDUNG=morgen ;;
                "3 19 * * 0-4")        MODUS=voll; MELDUNG=abend ;;
                "43 13 * * 0-4")       MODUS=voll; MELDUNG=aufgaben ;;
                *)                     MODUS=voll ;;
              esac ;;
          esac
          echo "modus=$MODUS" >> "$GITHUB_OUTPUT"
          echo "meldung=$MELDUNG" >> "$GITHUB_OUTPUT"
          echo "Betriebsart: $MODUS, Meldung: $MELDUNG"

      - name: Plan holen, filtern und verschluesseln
        env:
          MODUS: ${{ steps.art.outputs.modus }}
          UNTIS_SCHOOL: igs-osterholz-scharmbeck
          UNTIS_HOST: igs-osterholz-scharmbeck.webuntis.com
          UNTIS_USER: ${{ secrets.UNTIS_USER }}
          UNTIS_SECRET: ${{ secrets.UNTIS_SECRET }}
          UNTIS_PASSWORD: ${{ secrets.UNTIS_PASSWORD }}
          APP_CODE: ${{ secrets.APP_CODE }}
          APP_CODE_JASPER: ${{ secrets.APP_CODE }}
          APP_CODE_CATALINA: ${{ secrets.APP_CODE_CATALINA }}
          # Vergleichsbasis: zuerst der ausgecheckte data-Zweig, ersatzweise
          # die oeffentliche Adresse (falls der Zweig noch nicht existiert).
          BASIS_DIR: basis-stand
          BASIS_URL: https://raw.githubusercontent.com/${{ github.repository }}
          # Oeffentliches Protokoll -> keine Inhalte ausgeben
          KNAPP: '1'
        run: npm run sync

      - name: Bei Aenderungen benachrichtigen
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_KONTAKT: https://stundenplan-jasper.web.app
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          PUSH_SUBSCRIPTION_CATALINA: ${{ secrets.PUSH_SUBSCRIPTION_CATALINA }}
          APP_CODE: ${{ secrets.APP_CODE }}
          APP_CODE_CATALINA: ${{ secrets.APP_CODE_CATALINA }}
          KNAPP: '1'
        run: npm run push

      # Kurz vor einer Stunde, bei der noch eine Entschuldigung offen ist.
      # Liest die verschluesselte Sicherung der Person - der Server selbst
      # kennt die Fehlzeiten sonst nicht.
      - name: Erinnerung vor der Stunde
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_KONTAKT: https://stundenplan-jasper.web.app
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          PUSH_SUBSCRIPTION_CATALINA: ${{ secrets.PUSH_SUBSCRIPTION_CATALINA }}
          APP_CODE: ${{ secrets.APP_CODE }}
          APP_CODE_CATALINA: ${{ secrets.APP_CODE_CATALINA }}
          BASIS_DIR: basis-stand
          KNAPP: '1'
        run: npm run erinnerungen

      - name: Abendvorschau fuer morgen
        # Laeuft nur, wenn die Aufgabe es verlangt - nicht alle fuenf Minuten.
        if: steps.art.outputs.meldung == 'abend'
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_KONTAKT: https://stundenplan-jasper.web.app
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          PUSH_SUBSCRIPTION_CATALINA: ${{ secrets.PUSH_SUBSCRIPTION_CATALINA }}
          APP_CODE: ${{ secrets.APP_CODE }}
          APP_CODE_CATALINA: ${{ secrets.APP_CODE_CATALINA }}
          BASIS_DIR: basis-stand
          KNAPP: '1'
        run: npm run abend

      - name: Morgenueberblick fuer heute
        if: steps.art.outputs.meldung == 'morgen'
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_KONTAKT: https://stundenplan-jasper.web.app
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          PUSH_SUBSCRIPTION_CATALINA: ${{ secrets.PUSH_SUBSCRIPTION_CATALINA }}
          APP_CODE: ${{ secrets.APP_CODE }}
          APP_CODE_CATALINA: ${{ secrets.APP_CODE_CATALINA }}
          BASIS_DIR: basis-stand
          KNAPP: '1'
        run: npm run morgen

      - name: Hausaufgaben-Erinnerung fuer morgen
        if: steps.art.outputs.meldung == 'aufgaben'
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_KONTAKT: https://stundenplan-jasper.web.app
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          PUSH_SUBSCRIPTION_CATALINA: ${{ secrets.PUSH_SUBSCRIPTION_CATALINA }}
          APP_CODE: ${{ secrets.APP_CODE }}
          APP_CODE_CATALINA: ${{ secrets.APP_CODE_CATALINA }}
          BASIS_DIR: basis-stand
          KNAPP: '1'
        run: npm run aufgaben

      - name: Verschluesselte Daten veroeffentlichen
        run: |
          if ! ls public/data/plan*.enc.json >/dev/null 2>&1; then
            echo "Keine verschluesselten Daten (Zugangscode-Secret fehlt?) - Abbruch."
            exit 1
          fi
          mkdir out
          # Erst den bisherigen Stand uebernehmen: Wurde eine Person diesmal
          # uebersprungen (fehlendes Secret), bliebe ihre Datei sonst beim
          # force-push auf der Strecke und ihre App stuende ohne Plan da.
          cp basis-stand/*.enc.json out/ 2>/dev/null || true
          cp public/data/plan*.enc.json out/
          # Vermerke, was schon verschickt wurde (nur Datumsangaben bzw. Hashes).
          cp basis-stand/meldungen.json basis-stand/erinnerungen.json out/ 2>/dev/null || true
          cp public/data/meldungen.json public/data/erinnerungen.json out/ 2>/dev/null || true
          cd out
          git init -q -b data
          git config user.name "stundenplan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Stand $(date -u +%Y-%m-%dT%H:%M)"
          # Immer nur EIN Commit auf dem data-Zweig - so bleibt das Repo klein.
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
