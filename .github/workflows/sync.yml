name: Stundenplan abrufen

on:
  schedule:
    # Alle 15 Minuten an Schultagen. GitHub rechnet in UTC:
    # 4-16 UTC deckt 6-18 Uhr deutscher Zeit in Sommer UND Winter ab.
    - cron: '*/15 4-16 * * 1-5'
    # Abendvorschau: 19 UTC = 21:00 Sommerzeit / 20:00 Winterzeit,
    # sonntags bis donnerstags (fuer die Schultage Montag bis Freitag).
    - cron: '0 19 * * 0-4'
    # Morgenueberblick: 4:30 UTC = 6:30 Sommerzeit / 5:30 Winterzeit.
    - cron: '30 4 * * 1-5'
  workflow_dispatch: # erlaubt den Start von Hand

# Zwei gleichzeitige Laeufe wuerden sich gegenseitig ueberschreiben.
concurrency:
  group: stundenplan-sync
  cancel-in-progress: false

permissions:
  contents: write # zum Veroeffentlichen der Daten auf dem data-Zweig

jobs:
  abrufen:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Plan holen, filtern und verschluesseln
        env:
          UNTIS_SCHOOL: igs-osterholz-scharmbeck
          UNTIS_HOST: igs-osterholz-scharmbeck.webuntis.com
          UNTIS_USER: ${{ secrets.UNTIS_USER }}
          UNTIS_SECRET: ${{ secrets.UNTIS_SECRET }}
          UNTIS_PASSWORD: ${{ secrets.UNTIS_PASSWORD }}
          APP_CODE: ${{ secrets.APP_CODE }}
          APP_CODE_JASPER: ${{ secrets.APP_CODE }}
          APP_CODE_CATALINA: ${{ secrets.APP_CODE_CATALINA }}
          # Zuletzt veroeffentlichter Stand als Vergleichsbasis
          BASIS_URL: https://raw.githubusercontent.com/${{ github.repository }}
          # Oeffentliches Protokoll -> keine Inhalte ausgeben
          KNAPP: '1'
        run: npm run sync

      - name: Bei Aenderungen benachrichtigen
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_KONTAKT: https://stundenplan-jasper.web.app
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          KNAPP: '1'
        run: npm run push

      - name: Abendvorschau fuer morgen
        # Laeuft nur beim Abend-Zeitplan, nicht alle 15 Minuten.
        if: github.event.schedule == '0 19 * * 0-4'
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_KONTAKT: https://stundenplan-jasper.web.app
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          KNAPP: '1'
        run: npm run abend

      - name: Morgenueberblick fuer heute
        if: github.event.schedule == '30 4 * * 1-5'
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_KONTAKT: https://stundenplan-jasper.web.app
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          KNAPP: '1'
        run: npm run morgen

      - name: Verschluesselte Daten veroeffentlichen
        run: |
          if ! ls public/data/plan*.enc.json >/dev/null 2>&1; then
            echo "Keine verschluesselten Daten (Zugangscode-Secret fehlt?) - Abbruch."
            exit 1
          fi
          mkdir out
          cp public/data/plan*.enc.json out/
          cd out
          git init -q -b data
          git config user.name "stundenplan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Stand $(date -u +%Y-%m-%dT%H:%M)"
          # Immer nur EIN Commit auf dem data-Zweig - so bleibt das Repo klein.
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
