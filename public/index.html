<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Stundenplan</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stundenplan" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" href="icons/icon-180.png" />
    <link rel="stylesheet" href="styles.css?v=14" />
  </head>
  <body>
    <div class="app">
      <header class="kopf" id="kopf">
        <div class="kopf-zeile">
          <div class="kopf-text">
            <p class="kopf-datum" id="kopfDatum">&nbsp;</p>
            <h1 class="kopf-titel" id="kopfTitel">Stundenplan</h1>
          </div>
          <div class="kopf-rechts">
            <span class="woche-abzeichen" id="wocheAbzeichen" hidden>–</span>
            <button class="rund-knopf" id="aktualisieren" type="button" aria-label="Aktualisieren">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6" /><path d="M20.5 3.5V9H15" />
              </svg>
            </button>
          </div>
        </div>
        <p class="kopf-info" id="kopfInfo"></p>

        <div class="tagesfortschritt" id="tagesFortschritt" hidden>
          <div class="tf-balken"><div class="tf-fuellung" id="tfFuellung"></div></div>
          <span class="tf-text" id="tfText"></span>
        </div>

        <div class="umschalter" id="umschalter" role="tablist" aria-label="Ansicht wählen" hidden>
          <button class="um-knopf aktiv" id="ansichtTag" type="button" role="tab" aria-selected="true">Tag</button>
          <button class="um-knopf" id="ansichtWoche" type="button" role="tab" aria-selected="false">Woche</button>
        </div>

        <nav class="tagesleiste" id="tagesleiste" aria-label="Wochentag wählen" hidden></nav>
      </header>

      <main class="inhalt" id="inhalt">
        <p class="laden">Lade Stundenplan …</p>
      </main>

      <nav class="tableiste" id="tableiste" aria-label="Bereich wählen">
        <button class="tab" data-tab="plan" type="button" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.4" y="5.2" width="17.2" height="15.4" rx="2.5" />
            <path d="M3.4 10h17.2M8.2 2.8v4.6M15.8 2.8v4.6" />
          </svg>
          <span>Plan</span>
        </button>
        <button class="tab" data-tab="aufgaben" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.5 6.5h11M9.5 12h11M9.5 17.5h11" />
            <path d="M3.5 6.3l1.6 1.6 2.6-2.9M3.5 16.8l1.6 1.6 2.6-2.9" />
          </svg>
          <span>Aufgaben</span>
          <i class="tab-punkt" id="tabPunktAufgaben" hidden></i>
        </button>
        <button class="tab" data-tab="noten" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20V4M4 20h16" />
            <path d="M8 20v-5.5M12.7 20V9.5M17.4 20v-8" />
          </svg>
          <span>Noten</span>
        </button>
        <button class="tab" data-tab="mehr" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="5.5" cy="12" r="1.4" /><circle cx="12" cy="12" r="1.4" /><circle cx="18.5" cy="12" r="1.4" />
          </svg>
          <span>Mehr</span>
        </button>
      </nav>
    </div>

    <!-- Stunde geöffnet: Details, Hausaufgaben, eigene Notizen -->
    <div class="modal-hintergrund" id="modalHintergrund" hidden></div>
    <div class="modal" id="stundeModal" hidden role="dialog" aria-modal="true" aria-labelledby="modalFach">
      <div class="modal-karte">
        <button class="modal-schliessen" id="modalSchliessen" type="button" aria-label="Schließen">✕</button>

        <div class="modal-kopf">
          <span class="modal-block" id="modalBlock"></span>
          <h2 class="modal-fach" id="modalFach">Fach</h2>
          <p class="modal-zeile" id="modalZeile"></p>
          <span class="marke" id="modalMarke" hidden></span>
        </div>

        <div class="modal-koerper">
          <div id="modalAufgaben"></div>

          <label class="notiz-label" for="notizAufgabe">Meine Hausaufgabe</label>
          <textarea class="notiz-feld" id="notizAufgabe" rows="3" placeholder="Was ist bis zur nächsten Stunde zu tun?"></textarea>

          <label class="notiz-label" for="notizText">Notiz</label>
          <textarea class="notiz-feld" id="notizText" rows="3" placeholder="Material, Klausurtermin, Erinnerung …"></textarea>
        </div>

        <div class="modal-fuss">
          <button class="modal-knopf leise" id="notizLoeschen" type="button">Löschen</button>
          <button class="modal-knopf voll" id="notizSichern" type="button">Sichern</button>
        </div>
      </div>
    </div>

    <!-- Allzweck-Eingabefenster für Noten, Klausuren und Fehlzeiten -->
    <div class="modal" id="eingabeModal" hidden role="dialog" aria-modal="true" aria-labelledby="eingabeTitel">
      <div class="modal-karte">
        <button class="modal-schliessen" id="eingabeSchliessen" type="button" aria-label="Schließen">✕</button>
        <div class="modal-kopf">
          <h2 class="modal-fach" id="eingabeTitel">Eintrag</h2>
          <p class="modal-zeile" id="eingabeUnterzeile"></p>
        </div>
        <form class="modal-koerper" id="eingabeFelder"></form>
        <div class="modal-fuss">
          <button class="modal-knopf leise" id="eingabeLoeschen" type="button">Löschen</button>
          <button class="modal-knopf voll" id="eingabeSichern" type="button">Sichern</button>
        </div>
      </div>
    </div>

    <!-- Entsperren: nur beim ersten Start auf einem Gerät -->
    <div class="sperre" id="sperre" hidden>
      <img class="sperre-icon" src="icons/icon-192.png" alt="" width="72" height="72" />
      <h1 class="sperre-titel">Stundenplan</h1>
      <p class="sperre-text">
        Gib deinen Zugangscode ein. Die Daten sind verschlüsselt und werden erst auf
        diesem Gerät lesbar.
      </p>
      <form class="sperre-form" id="sperreForm">
        <div class="sperre-wer" id="sperreWer"></div>
        <input
          class="sperre-feld"
          id="sperreCode"
          type="password"
          inputmode="text"
          autocomplete="current-password"
          placeholder="Zugangscode"
          aria-label="Zugangscode"
          required
        />
        <button class="sperre-knopf" id="sperreKnopf" type="submit">Entsperren</button>
      </form>
      <p class="sperre-fehler" id="sperreFehler" hidden>Code stimmt nicht.</p>
      <p class="sperre-fuss">Du brauchst den Code nur dieses eine Mal.</p>
    </div>

    <!-- Push-Anmeldung -->
    <div class="blatt" id="pushBlatt" hidden>
      <div class="blatt-griff"></div>
      <div class="blatt-kopf">
        <h2>Mitteilungen</h2>
        <button class="blatt-schliessen" id="pushSchliessen" type="button">Fertig</button>
      </div>
      <div class="blatt-inhalt">
        <p class="notiz-zeit" id="pushStatus"></p>
        <p class="push-hinweis" id="pushHinweis"></p>
        <textarea class="notiz-feld" id="pushDaten" rows="5" readonly hidden></textarea>
        <button class="sperre-knopf" id="pushKopieren" type="button" hidden>Anmeldung kopieren</button>
      </div>
    </div>
    <div class="blatt-hintergrund" id="blattHintergrund" hidden></div>

    <script type="module" src="app.js?v=14"></script>
  </body>
</html>
